<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Məhəmməd - Rəsmi Bildiriş</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            padding: 20px;
            border: 2px solid #333;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            width: 80%;
        }

        h1 {
            font-size: 28px;
            color: #ff4d4d;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .info {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 30px;
        }

        .decision {
            font-weight: bold;
            color: #00d4ff;
            border-top: 1px dashed #555;
            padding-top: 20px;
        }

        #qacan-yazi {
            position: absolute;
            padding: 15px 30px;
            background: #ff4d4d;
            color: white;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            touch-action: none;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SON ZƏNGƏ HƏLƏ ÇOX VAR! 🔔</h1>
        <p class="info">BLOKDAN ZEİF YIĞSAZ SON ZENG YADIZA DÜŞMEYECEK.</p>
        
        <div class="decision">
            ⚠️ Məhəmməd qərarını 1 ay ərzində deyəcək.
        </div>
    </div>

    <button id="qacan-yazi">Etiraz Et!</button>

    <script>
        const btn = document.getElementById('qacan-yazi');
        
        const qacirt = () => {
            const x = Math.random() * (window.innerWidth - btn.clientWidth);
            const y = Math.random() * (window.innerHeight - btn.clientHeight);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        };

        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            qacirt();
        });

        btn.addEventListener('mouseover', qacirt);

        btn.addEventListener('click', () => {
            alert("Etiraz qəbul olunmadı! Gözləməkdə qalın.");
        });
    </script>

</body>
</html>
