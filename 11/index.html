<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Xətası</title>
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: monospace;
            margin: 0;
            overflow: hidden; /* Sürüşdürməni bağlayır */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #basliq {
            color: red;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 5px;
            border-bottom: 2px dashed red;
            animation: yanib-sonme 0.8s infinite;
        }
        #terminal {
            flex-grow: 1;
            padding: 10px;
            font-size: 0.8rem;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Yazıları həmişə aşağıda tutur */
        }
        @keyframes yanib-sonme {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #baslama-ekrani {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            z-index: 10;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="baslama-ekrani" onclick="basla()">
        Səhifəni yükləmək üçün ekrana toxunun
    </div>

    <div id="basliq">
        ⚠ KRİTİK XƏTA: SİSTEMƏ MÜDAXİLƏ! ⚠<br>
        BÜTÜN FAYLLAR MƏHƏMMƏD TƏRƏFİNDƏN ŞİFRƏLƏNDİ.
    </div>
    
    <div id="terminal"></div>

    <script>
        function basla() {
            // Başlama ekranını gizlət və tam ekrana keç
            document.getElementById('baslama-ekrani').style.display = 'none';
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            } catch(e) {}

            const terminal = document.getElementById('terminal');
            const qovluqlar = ['DCIM/Camera', 'WhatsApp/Media', 'Download', 'Pictures/Screenshots', 'Documents'];
            const uzantilar = ['.jpg', '.mp4', '.pdf', '.db', '.txt', '.png'];
            
            setInterval(() => {
                const qovluq = qovluqlar[Math.floor(Math.random() * qovluqlar.length)];
                const uzanti = uzantilar[Math.floor(Math.random() * uzantilar.length)];
                const faylAdi = 'FILE_' + Math.floor(Math.random() * 9999999) + uzanti;
                const hecm = (Math.random() * 45).toFixed(1);
                
                const yeniSetir = document.createElement('div');
                yeniSetir.innerHTML = `[+] /storage/emulated/0/${qovluq}/${faylAdi} (${hecm}MB) <span style="color:red;">ŞİFRƏLƏNDİ</span>`;
                terminal.appendChild(yeniSetir);
                
                // Telefon donmasın deyə ekranda maksimum 25 sətir saxlayır
                if (terminal.childElementCount > 25) {
                    terminal.removeChild(terminal.firstChild);
                }
            }, 100); // Sürəti burdan tənzimləyə bilərsən
        }
    </script>
</body>
</html>
