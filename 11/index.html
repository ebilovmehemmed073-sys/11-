<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarafat Saytı</title>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            font-size: 35px;
            padding: 20px;
            text-shadow: 2px 2px 10px white;
            animation: pulse 1s infinite alternate;
        }

        #qacan-yazi {
            position: absolute;
            padding: 20px 40px;
            background: #ffffff;
            color: #000;
            font-weight: bold;
            font-size: 20px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
            touch-action: none; /* Telefonda sürüşməni önləyir */
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); text-shadow: 0 0 20px yellow; }
        }
    </style>
</head>
<body>

    <h1>SON ZƏNGƏ HƏLƏ ÇOX VAR! 🔔</h1>
    <button id="qacan-yazi">Məktəb Bitdi!</button>

    <script>
        const btn = document.getElementById('qacan-yazi');
        
        // Həm toxunma, həm də üzərinə gəlmə hadisəsi
        const qacirt = () => {
            const x = Math.random() * (window.innerWidth - btn.clientWidth);
            const y = Math.random() * (window.innerHeight - btn.clientHeight);
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        };

        btn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Klikləməyi çətinləşdirir
            qacirt();
        });

        btn.addEventListener('click', () => {
            alert("Təəssüf! Hələ imtahanlar və dərslər səni gözləyir! 😂");
        });
    </script>

</body>
</html>
